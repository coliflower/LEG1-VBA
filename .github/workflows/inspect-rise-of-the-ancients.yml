name: Inspect Rise Of The Ancients API Structure

on:
  push:
    paths:
      - ".github/workflows/inspect-rise-of-the-ancients.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-api:
    runs-on: ubuntu-24.04
    steps:
      - name: Authenticate and test member-scoped tournament access
        env:
          CT_EMAIL: ${{ secrets.CT_EMAIL }}
          CT_PASSWORD: ${{ secrets.CT_PASSWORD }}
        run: |
          python3 <<'PY'
          import json, os, urllib.parse, urllib.request, urllib.error
          BASE = "https://api.chesttracker.com"
          UA = "LEG1-API-ImpersonationTest/1.0"

          def req(path, method="GET", body=None, token=None):
              url = BASE + path
              headers = {"Accept":"application/json","Content-Type":"application/json","User-Agent":UA}
              if token:
                  headers["Authorization"] = token
              data = json.dumps(body).encode() if body is not None else None
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, data=data, headers=headers, method=method), timeout=60) as r:
                      raw = r.read().decode("utf-8")
                      try:
                          return r.status, json.loads(raw)
                      except json.JSONDecodeError:
                          return r.status, raw
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode("utf-8", errors="replace")

          email = os.environ.get("CT_EMAIL","")
          password = os.environ.get("CT_PASSWORD","")
          if not email or not password:
              raise SystemExit("Missing CT_EMAIL or CT_PASSWORD.")

          print("1. Authenticating...")
          status, auth = req("/v1/authenticate", "POST",
                             {"email":email, "password":password, "remember":False})
          if status != 200 or not isinstance(auth, dict) or not auth.get("authToken"):
              raise SystemExit(f"Authentication failed: HTTP {status}: {auth}")
          token = auth["authToken"]
          if not token.lower().startswith("bearer "):
              token = "Bearer " + token
          print("   Authentication: OK")

          print("2. Reading one member to obtain a real memberId...")
          status, members = req("/v1/members?page=0&size=1&fields=id,name,rank", token=token)
          print("   HTTP:", status)
          if status != 200 or not isinstance(members, list) or not members or not isinstance(members[0], list):
              raise SystemExit(f"Member lookup failed: HTTP {status}: {members}")

          member = members[0][0]
          member_id = member.get("id") if isinstance(member, dict) else None
          member_name = member.get("name") if isinstance(member, dict) else None
          if not member_id:
              raise SystemExit(f"No memberId found in response: {members}")

          print("   Member:", member_name)
          print("   memberId:", member_id)

          print("3. Testing /v1/impersonate with that memberId...")
          status, scoped = req("/v1/impersonate", "POST", {"memberId":member_id}, token=token)
          print("   HTTP:", status)
          if status != 200 or not isinstance(scoped, dict) or not scoped.get("authToken"):
              print("   IMPERSONATE ERROR:", scoped)
              print("TEST RESULT: IMPERSONATION NOT AVAILABLE FOR THIS MEMBER.")
              raise SystemExit(0)

          scoped_token = scoped["authToken"]
          if not scoped_token.lower().startswith("bearer "):
              scoped_token = "Bearer " + scoped_token
          print("   Impersonation: OK")

          print("4. Testing /v1/members with member-scoped token...")
          status, scoped_members = req("/v1/members?page=0&size=1&fields=id,name,rank", token=scoped_token)
          print("   HTTP:", status)
          print("   RESPONSE:", json.dumps(scoped_members, ensure_ascii=False)[:12000])

          print("5. Testing /v1/tournaments with member-scoped token...")
          status, tournaments = req("/v1/tournaments?page=0&size=5", token=scoped_token)
          print("   HTTP:", status)
          if status == 200:
              print("   TOURNAMENTS RESPONSE:", json.dumps(tournaments, ensure_ascii=False)[:20000])
          else:
              print("   TOURNAMENTS ERROR:", tournaments)

          print("6. Testing /v1/tournaments/summary with member-scoped token...")
          start="2026-04-15T00:00:00.000Z"
          end="2026-04-16T00:00:00.000Z"
          query=urllib.parse.urlencode({"start":start,"end":end})
          status, summary = req("/v1/tournaments/summary?" + query, token=scoped_token)
          print("   HTTP:", status)
          if status == 200:
              print("   SUMMARY RESPONSE:", json.dumps(summary, ensure_ascii=False)[:30000])
          else:
              print("   SUMMARY ERROR:", summary)

          print("TEST RESULT: MEMBER-SCOPED TOURNAMENT AUTHORIZATION DIAGNOSTICS COMPLETED.")
          PY
