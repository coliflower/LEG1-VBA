name: Inspect Rise Of The Ancients API Structure

on:
  push:
    paths:
      - ".github/workflows/inspect-rise-of-the-ancients.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-api:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect live summary response
        env:
          CT_EMAIL: ${{ secrets.CT_EMAIL }}
          CT_PASSWORD: ${{ secrets.CT_PASSWORD }}
        run: |
          python3 <<'PY'
          import json, os, urllib.parse, urllib.request, urllib.error
          BASE="https://api.chesttracker.com"

          def req(url,method="GET",body=None,token=None):
              h={"Accept":"application/json","Content-Type":"application/json","User-Agent":"LEG1-API-LiveSummaryTest/1.1"}
              if token: h["Authorization"]=token
              data=json.dumps(body).encode() if body is not None else None
              try:
                  with urllib.request.urlopen(urllib.request.Request(url,data=data,headers=h,method=method),timeout=60) as r:
                      return json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  raise SystemExit(f"API request failed: HTTP {e.code}: {e.read().decode(errors='replace')}")

          print("1. Authenticating...")
          a=req(BASE+"/v1/authenticate","POST",{"email":os.environ["CT_EMAIL"],"password":os.environ["CT_PASSWORD"],"remember":False})
          token=a.get("authToken")
          if not token: raise SystemExit("Authentication returned no authToken.")
          if not token.lower().startswith("bearer "): token="Bearer "+token
          print("   Authentication: OK")

          start="2026-04-15T00:00:00.000Z"
          end="2026-04-16T00:00:00.000Z"
          url=BASE+"/v1/tournaments/summary?"+urllib.parse.urlencode({"start":start,"end":end})
          print("2. Calling live summary endpoint...")
          result=req(url,token=token)
          print("   Response type:",type(result).__name__)

          if isinstance(result,dict):
              print("   Top-level keys:",sorted(result.keys()))
              for k,v in result.items():
                  print("   FIELD",k,"TYPE",type(v).__name__,"LEN",len(v) if hasattr(v,"__len__") else "n/a")
                  if isinstance(v,list) and v and isinstance(v[0],dict):
                      print("   FIRST ITEM KEYS:",sorted(v[0].keys()))
          elif isinstance(result,list):
              print("   List length:",len(result))
              for i,v in enumerate(result[:3]):
                  print("   ITEM",i,"TYPE",type(v).__name__,"LEN",len(v) if hasattr(v,"__len__") else "n/a")
                  if isinstance(v,dict): print("   ITEM",i,"KEYS",sorted(v.keys()))
          else:
              print("   Scalar response:",str(result)[:500])

          print("TEST RESULT: LIVE RESPONSE STRUCTURE INSPECTED.")
          PY