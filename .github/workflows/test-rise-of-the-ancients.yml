name: Inspect ChestTracker Rise Of The Ancients Structure

on:
  push:
    paths:
      - ".github/workflows/test-rise-of-the-ancients.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-api:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect concrete tournament response
        env:
          CT_EMAIL: ${{ secrets.CT_EMAIL }}
          CT_PASSWORD: ${{ secrets.CT_PASSWORD }}
        run: |
          python3 <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request
          import urllib.error

          BASE = "https://api.chesttracker.com"
          USER_AGENT = "LEG1-RiseOfTheAncients-StructureTest/1.0"

          def request_json(url, method="GET", body=None, token=None):
              headers = {
                  "Accept": "application/json",
                  "Content-Type": "application/json",
                  "User-Agent": USER_AGENT,
              }
              if token:
                  headers["Authorization"] = token
              data = json.dumps(body).encode("utf-8") if body is not None else None
              req = urllib.request.Request(url, data=data, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=60) as response:
                      return json.loads(response.read().decode("utf-8"))
              except urllib.error.HTTPError as exc:
                  detail = exc.read().decode("utf-8", errors="replace")
                  raise SystemExit(f"API request failed: HTTP {exc.code}: {detail}")

          def describe(value, indent=0):
              prefix = " " * indent
              if isinstance(value, dict):
                  print(prefix + f"OBJECT ({len(value)} keys)")
                  for key in sorted(value.keys()):
                      v = value[key]
                      if isinstance(v, list):
                          print(prefix + f"  {key}: LIST length={len(v)}")
                          if v:
                              describe(v[0], indent + 4)
                      elif isinstance(v, dict):
                          print(prefix + f"  {key}: OBJECT")
                          print(prefix + "    keys: " + ", ".join(sorted(v.keys())))
                      else:
                          print(prefix + f"  {key}: {type(v).__name__}")
              elif isinstance(value, list):
                  print(prefix + f"LIST length={len(value)}")
                  if value:
                      describe(value[0], indent + 2)
              else:
                  print(prefix + type(value).__name__)

          email = os.environ.get("CT_EMAIL", "")
          password = os.environ.get("CT_PASSWORD", "")
          if not email or not password:
              raise SystemExit("Missing CT_EMAIL or CT_PASSWORD.")

          print("1. Authenticating...")
          auth = request_json(
              BASE + "/v1/authenticate",
              method="POST",
              body={"email": email, "password": password, "remember": False},
          )
          token = auth.get("authToken")
          if not token:
              raise SystemExit("Authentication returned no authToken.")
          if not token.lower().startswith("bearer "):
              token = "Bearer " + token
          print("   Authentication: OK")

          print("2. Loading tournaments...")
          payload = request_json(
              BASE + "/v1/tournaments?" + urllib.parse.urlencode({"page": 0, "size": 100}),
              token=token,
          )
          if not isinstance(payload, list) or len(payload) != 2:
              raise SystemExit("Unexpected /v1/tournaments response format.")

          items, total = payload
          target = [
              x for x in items
              if isinstance(x, dict)
              and str(x.get("type", "")).strip().lower() == "rise of the ancients"
          ]
          if not target:
              raise SystemExit("No Rise Of The Ancients tournament found.")

          tournament = target[0]
          tournament_id = tournament.get("id")
          print(f"   Rise Of The Ancients found: {len(target)} in first page")
          print(f"   Date: {tournament.get('date')}")
          print(f"   Status: {tournament.get('status')}")

          print("3. Loading concrete tournament...")
          detail = request_json(
              BASE + "/v1/tournaments/" + urllib.parse.quote(str(tournament_id), safe=""),
              token=token,
          )
          if not isinstance(detail, dict):
              raise SystemExit("Unexpected concrete tournament response.")

          print("4. Concrete tournament response structure:")
          describe(detail)

          print("5. Candidate player/result fields:")
          candidates = []
          for key, value in detail.items():
              low = str(key).lower()
              if any(word in low for word in ("member", "player", "participant", "entry", "rank", "score", "point", "result", "reward")):
                  candidates.append((key, type(value).__name__, len(value) if isinstance(value, (list, dict, str)) else ""))
          if candidates:
              for item in candidates:
                  print("   " + " | ".join(map(str, item)))
          else:
              print("   None found at top level.")

          print("TEST RESULT: Structure inspection completed.")
          PY
